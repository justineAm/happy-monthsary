<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Monthsary ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background: linear-gradient(135deg,#1e1e2f,#ff4e8a);
    color:white;
    text-align:center;
    overflow-x:hidden;
}

/* Floating hearts */
.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    animation: floatUp 8s linear infinite;
    opacity:0.7;
}

@keyframes floatUp{
    0%{transform:translateY(0);opacity:0;}
    50%{opacity:1;}
    100%{transform:translateY(-100vh);opacity:0;}
}

/* Header */
header{
    padding:70px 20px 40px;
}

h1{
    font-size:3rem;
    margin-bottom:10px;
    text-shadow:0 0 15px #ff9ecf;
}

.counter{
    font-size:1.3rem;
    margin-top:15px;
    background:rgba(255,255,255,0.1);
    display:inline-block;
    padding:15px 25px;
    border-radius:20px;
    backdrop-filter:blur(10px);
}

/* Love letter button */
button{
    margin-top:25px;
    padding:12px 28px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4e8a;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff4e8a;
    color:white;
    transform:scale(1.05);
}

/* Love letter popup */
.popup{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    color:#333;
    padding:30px;
    border-radius:20px;
    width:80%;
    max-width:400px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
    animation: fadeIn 0.5s ease;
}

.popup h2{
    color:#ff4e8a;
    margin-bottom:15px;
}

.close{
    margin-top:15px;
    background:#ff4e8a;
    color:white;
}

@keyframes fadeIn{
    from{opacity:0; transform:translate(-50%,-60%);}
    to{opacity:1; transform:translate(-50%,-50%);}
}

/* Typewriter */
.typewriter{
    margin-top:40px;
    font-size:1.2rem;
    min-height:60px;
}
</style>
</head>

<body>

<header>
    <h1>Happy 20th Month of Love My Luna ❤️</h1>
    <div class="counter" id="counter"></div>

    <button onclick="openLetter()">Open My Heart 💌</button>

    <div class="typewriter" id="typeText"></div>
</header>

<div class="popup" id="loveLetter">
    <h2>My Love 💖</h2>
    <p>
        Every day with you feels special.  
        Thank you for choosing me, for staying,  
        and for loving me even when I am not perfect.  
        I promise to love you better each month.  
        Happy Monthsary, my forever.
    </p>
    <button class="close" onclick="closeLetter()">Close</button>
</div>

<script>
// =======================
// LOVE TIMER
// =======================

const startDate = new Date("2024-06-22"); // CHANGE THIS TO YOUR REAL DATE

function updateCounter(){
    const now = new Date();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const minutes = Math.floor((diff / (1000*60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("counter").innerHTML =
        "We've been together for ❤️<br>" +
        days + " days " + hours + " hrs " + minutes + " mins " + seconds + " secs";
}

setInterval(updateCounter,1000);
updateCounter();

// =======================
// FLOATING HEARTS
// =======================

function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (15 + Math.random()*25) + "px";
    document.body.appendChild(heart);

    setTimeout(()=>{heart.remove();},8000);
}

setInterval(createHeart,500);

// =======================
// POPUP
// =======================

function openLetter(){
    document.getElementById("loveLetter").style.display="block";
}

function closeLetter(){
    document.getElementById("loveLetter").style.display="none";
}

// =======================
// TYPEWRITER EFFECT
// =======================

const text = "With you, every month feels like the best chapter of my life. 💕";
let index = 0;

function typeEffect(){
    if(index < text.length){
        document.getElementById("typeText").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeEffect,50);
    }
}

typeEffect();

</script>

</body>
</html>
