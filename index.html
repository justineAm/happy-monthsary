<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Monthsary ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background: url('us_two.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
    text-align: center;
    overflow-x: hidden;
    position: relative;
}
body::before {
    content: "";
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0, 0, 50, 0.4); /* semi-transparent dark overlay */
    z-index:0;
}

header, .counter, button, .popup, .typewriter {
    position: relative;
    z-index:1; /* make sure content is above overlay */
}

/* Responsive adjustments for mobile */
@media (max-width: 600px) {
    header {
        padding-top: 150px; /* move header down so faces are visible */
    }

    h1 {
        font-size: 2rem; /* smaller header */
    }

    .counter {
        font-size: 1rem;
        padding: 10px 20px;
    }

    .typewriter {
        font-size: 1rem;
        margin-top: 20px;
    }

    button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 0.9rem;
    }
}


/* Floating hearts */
.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    animation: floatUp 8s linear infinite;
    opacity:0.7;
    color: #66ccff;
}

@keyframes floatUp{
    0%{transform:translateY(0);opacity:0;}
    50%{opacity:1;}
    100%{transform:translateY(-100vh);opacity:0;}
}

/* Header */
header{
    padding:70px 20px 40px;
}

h1{
    font-size:3rem;
    margin-bottom:10px;
    text-shadow:0 0 15px #ff9ecf;
}

.counter{
    font-size:1.3rem;
    margin-top:15px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius:20px;
    padding:15px 25px;
    display:inline-block;
}

/* Love letter button */
button{
    margin-top:25px;
    padding:12px 28px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4e8a;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
    display: block;
    margin: 220px auto 0; /* moves button further down */
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #ff4e8a;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
}

button:hover{
    background:#ff4e8a;
    color:white;
    transform:scale(1.05);
}

/* Love letter popup */
.popup{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    color:#333;
    padding:30px;
    border-radius:20px;
    width:80%;
    max-width:400px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
    animation: fadeIn 0.5s ease;
}

.popup h2{
    color:#ff4e8a;
    margin-bottom:15px;
}

.close{
    margin-top:15px;
    background:#ff4e8a;
    color:white;
}

@keyframes fadeIn{
    from{opacity:0; transform:translate(-50%,-60%);}
    to{opacity:1; transform:translate(-50%,-50%);}
}

/* Typewriter */
.typewriter{
    margin-top:40px;
    font-size:1.2rem;
    min-height:60px;
}
</style>
</head>

<body>

<header>
    <h2>Happy 20th Month of Love My Luna ❤️</h2>
    <div class="counter" id="counter"></div>

    <button id="openHeart" onclick="openLetter()">Open My Heart 💌</button>

    <div class="typewriter" id="typeText"></div>
</header>

<div class="popup" id="loveLetter">
    <h2>My Love 💖</h2>
    <p>
        Every day with you feels special.  
        Thank you for choosing me, for staying,  
        and for loving me even when I am not perfect.  
        I promise to love you better each month.  
        Happy Monthsary, my forever.
    </p>
    <button class="close" onclick="closeLetter()">Close</button>
</div>

<script>
// =======================
// LOVE TIMER
// =======================

const startDate = new Date("2024-06-22T00:00:00+08:00"); // Your start date

function updateCounter() {
    const now = new Date();

    // Calculate years and months
    let years = now.getFullYear() - startDate.getFullYear();
    let months = now.getMonth() - startDate.getMonth();
    let days = now.getDate() - startDate.getDate();

    if (days < 0) {
        months--;
        const lastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += lastMonth.getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    // Weeks from remaining days
    const weeks = Math.floor(days / 7);
    const remainingDays = days % 7;

    // Hours, minutes, seconds
    const diff = now - startDate;
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    // Romantic sentence
    document.getElementById("counter").innerHTML =
        `We've been together for ` +
        `${years} Year${years !== 1 ? 's' : ''}, ` +
        `${months} Month${months !== 1 ? 's' : ''}, ` +
        `${weeks} Week${weeks !== 1 ? 's' : ''}, ` +
        `${remainingDays} Day${remainingDays !== 1 ? 's' : ''}, ` +
        `${hours} Hour${hours !== 1 ? 's' : ''}, ` +
        `${minutes} Minute${minutes !== 1 ? 's' : ''}, and ` +
        `${seconds} Second${seconds !== 1 ? 's' : ''} ❤️`;
}

setInterval(updateCounter, 1000);
updateCounter();



// =======================
// FLOATING HEARTS
// =======================

function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (15 + Math.random()*25) + "px";
    document.body.appendChild(heart);

    setTimeout(()=>{heart.remove();},8000);
}

setInterval(createHeart,500);

// =======================
// POPUP
// =======================

function openLetter(){
    document.getElementById("loveLetter").style.display="block";
}

function closeLetter(){
    document.getElementById("loveLetter").style.display="none";
}

// =======================
// TYPEWRITER EFFECT
// =======================

const text = "With you, every month feels like the best chapter of my life. 💕";
let index = 0;

function typeEffect(){
    if(index < text.length){
        document.getElementById("typeText").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeEffect,50);
    }
}

typeEffect();

</script>

</body>
</html>
